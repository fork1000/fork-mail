<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>temp mail</title>
</head>
<body>

    <h1>temp mail</h1>
    <hr>

    <h2>your email</h2>
    <p>
        <code id="emailDisplay">loading...</code>
        <button id="copyBtn">copy</button>
        <button id="newBtn">new</button>
    </p>

    <hr>

    <h2>inbox</h2>
    <p><button id="refreshBtn">refresh</button></p>

    <table border="1">
        <thead>
            <tr><th>from</th><th>subject</th><th>time</th></tr>
        </thead>
        <tbody id="inboxBody">
            <tr><td colspan="3">loading...</td</tr>
        </tbody>
    </table>

    <hr>

    <p><strong>message:</strong></p>
    <pre id="messageBody" style="font-family: monospace; white-space: pre-wrap;">select an email</pre>

    <script>
        let account = null;
        let refreshTimer = null;
        let availableDomains = [];
        const API = 'https://api.mail.tm';

        async function fetchDomains() {
            const res = await fetch(`${API}/domains`);
            if (!res.ok) throw new Error('cannot fetch domains');
            const data = await res.json();
            const members = data['hydra:member'] || [];
            availableDomains = members.map(function(item) {
                if (typeof item === 'string') return item;
                if (item && item.domain) return item.domain;
                if (item && item['@id']) return item['@id'].replace('/domains/', '');
                return null;
            }).filter(function(d) { return d !== null; });
            
            if (availableDomains.length === 0) {
                availableDomains = ['cliptik.net', 'dle9ja.com', 'emltmp.com', 'fammix.com', 'mail.tm'];
            }
            return availableDomains;
        }

        async function createAccount() {
            if (availableDomains.length === 0) {
                await fetchDomains();
            }
            
            const domain = availableDomains[Math.floor(Math.random() * availableDomains.length)];
            const name = Math.random().toString(36).substring(2, 15);
            const email = name + '@' + domain;
            const password = Math.random().toString(36).substring(2, 20);

            const res = await fetch(API + '/accounts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ address: email, password: password })
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error('API error: ' + res.status);
            }

            const acc = await res.json();

            const tokenRes = await fetch(API + '/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ address: email, password: password })
            });

            if (!tokenRes.ok) {
                throw new Error('token failed');
            }

            const tokenData = await tokenRes.json();

            return {
                id: acc.id,
                address: email,
                token: tokenData.token
            };
        }

        async function fetchMessages() {
            if (!account) return [];
            const res = await fetch(API + '/messages', {
                headers: { 'Authorization': 'Bearer ' + account.token }
            });
            if (!res.ok) return [];
            const data = await res.json();
            return data['hydra:member'] || [];
        }

        async function fetchMessageBody(id) {
            const res = await fetch(API + '/messages/' + id, {
                headers: { 'Authorization': 'Bearer ' + account.token }
            });
            if (!res.ok) return null;
            return await res.json();
        }

        async function refreshInbox() {
            if (!account) return;
            try {
                const messages = await fetchMessages();
                const tbody = document.getElementById('inboxBody');
                
                if (messages.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3">empty - send an email to your address</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                for (var i = 0; i < messages.length; i++) {
                    var msg = messages[i];
                    var row = tbody.insertRow();
                    var fromCell = row.insertCell(0);
                    var subjectCell = row.insertCell(1);
                    var timeCell = row.insertCell(2);
                    
                    var fromText = '?';
                    if (msg.from) {
                        if (typeof msg.from === 'string') fromText = msg.from;
                        else if (msg.from.address) fromText = msg.from.address;
                        else fromText = JSON.stringify(msg.from);
                    }
                    fromCell.textContent = fromText;
                    subjectCell.textContent = msg.subject || '(no subject)';
                    var date = new Date(msg.createdAt);
                    timeCell.textContent = date.toLocaleTimeString();
                    row.style.cursor = 'pointer';
                    
                    row.onclick = (function(messageId) {
                        return function() {
                            fetchMessageBody(messageId).then(function(full) {
                                if (full) {
                                    var content = full.text || full.html || '(no content)';
                                    if (full.html && !full.text) {
                                        content = full.html.replace(/<[^>]*>/g, ' ');
                                    }
                                    document.getElementById('messageBody').textContent = content;
                                }
                            });
                        };
                    })(msg.id);
                }
            } catch(e) {
                console.error('refresh error:', e);
            }
        }

        async function init() {
            if (refreshTimer) clearInterval(refreshTimer);
            var emailDisplay = document.getElementById('emailDisplay');
            var inboxBody = document.getElementById('inboxBody');
            emailDisplay.textContent = 'creating...';
            inboxBody.innerHTML = '<tr><td colspan="3">creating account...</td></tr>';
            
            try {
                await fetchDomains();
                account = await createAccount();
                emailDisplay.textContent = account.address;
                await refreshInbox();
                refreshTimer = setInterval(refreshInbox, 10000);
            } catch(e) {
                emailDisplay.textContent = 'error: ' + e.message;
                inboxBody.innerHTML = '<tr><td colspan="3">failed - click new button to retry</td></tr>';
                console.error(e);
            }
        }

        document.getElementById('copyBtn').onclick = function() {
            if (account && account.address) {
                navigator.clipboard.writeText(account.address);
                alert('copied: ' + account.address);
            }
        };

        document.getElementById('newBtn').onclick = function() {
            if (refreshTimer) clearInterval(refreshTimer);
            init();
        };

        document.getElementById('refreshBtn').onclick = refreshInbox;

        init();
    </script>

</body>
</html>
